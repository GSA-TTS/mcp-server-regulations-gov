[project]
name = "mcp-server-regulations-gov"
version = "0.1.0"
description = "MCP server for the regulations.gov API — search federal documents, comments, and dockets"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=3.2.4",
    "httpx>=0.28",
    "pypdf>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regulations_gov"]
